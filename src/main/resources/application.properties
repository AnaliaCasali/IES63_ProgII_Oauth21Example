spring.application.name=oauth

# URL pública del Authorization Server (este mismo proyecto)
app.auth-server-url=http://localhost:8080
spring.security.oauth2.authorizationserver.issuer=${app.auth-server-url}

# Orígenes permitidos por CORS (Angular en desarrollo)
app.cors.allowed-origins=http://localhost:4200

# ------------------------------------------------------------------
# Clientes OAuth 2.1 registrados en el Authorization Server.
# Todos son públicos (sin secreto): client-authentication-methods=none
# y require-proof-key=true obliga a usar PKCE.
# ------------------------------------------------------------------

# Postman
spring.security.oauth2.authorizationserver.client.postman.registration.client-id=postman-client
spring.security.oauth2.authorizationserver.client.postman.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.postman.registration.authorization-grant-types=authorization_code
spring.security.oauth2.authorizationserver.client.postman.registration.redirect-uris=https://oauth.pstmn.io/v1/callback
spring.security.oauth2.authorizationserver.client.postman.registration.scopes=openid,profile,api.read
spring.security.oauth2.authorizationserver.client.postman.require-proof-key=true

# Swagger UI
spring.security.oauth2.authorizationserver.client.swagger.registration.client-id=swagger-client
spring.security.oauth2.authorizationserver.client.swagger.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.swagger.registration.authorization-grant-types=authorization_code
spring.security.oauth2.authorizationserver.client.swagger.registration.redirect-uris=${app.auth-server-url}/swagger-ui/oauth2-redirect.html
spring.security.oauth2.authorizationserver.client.swagger.registration.scopes=openid,profile,api.read
spring.security.oauth2.authorizationserver.client.swagger.require-proof-key=true

# Angular (futuro cliente SPA)
spring.security.oauth2.authorizationserver.client.angular.registration.client-id=angular-client
spring.security.oauth2.authorizationserver.client.angular.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.angular.registration.authorization-grant-types=authorization_code
spring.security.oauth2.authorizationserver.client.angular.registration.redirect-uris=http://localhost:4200/callback
spring.security.oauth2.authorizationserver.client.angular.registration.post-logout-redirect-uris=http://localhost:4200/
spring.security.oauth2.authorizationserver.client.angular.registration.scopes=openid,profile,api.read
spring.security.oauth2.authorizationserver.client.angular.require-proof-key=true

# Swagger UI: usa el cliente swagger-client con PKCE
springdoc.swagger-ui.oauth.client-id=swagger-client
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid,api.read
