# Perfil opcional: suma "Login con Google" en la pantalla /login del Authorization Server.
# Activar con: --spring.profiles.active=google  (requiere las variables CLIENTID y CLIENTSECRET)
# Redirect URI a registrar en Google Cloud Console: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${CLIENTID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENTSECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
